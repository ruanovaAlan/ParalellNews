<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ParallelNews{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --surface2: #22263a;
      --border:   #2e3248;
      --text:     #e2e4f0;
      --muted:    #7c8099;
      --accent:   #6c63ff;
      --accent2:  #00d4aa;
      --success:  #22c987;
      --danger:   #ff5c6c;
      --warn:     #ffb84d;
      --radius:   10px;
      --card-r:   14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 0 2rem;
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-weight: 700;
      font-size: 17px;
      color: var(--accent);
      letter-spacing: -.3px;
    }
    .nav-logo span { color: var(--accent2); }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 8px;
      transition: background .15s, color .15s;
    }
    nav a:hover, nav a.active {
      background: var(--surface2);
      color: var(--text);
    }

    /* MAIN WRAPPER */
    main { max-width: 1200px; margin: 0 auto; padding: 2rem; }

    /* PAGE HEADER */
    .page-header { margin-bottom: 2rem; }
    .page-header h1 { font-size: 24px; font-weight: 700; margin-bottom: .25rem; }
    .page-header p  { color: var(--muted); font-size: 14px; }

    /* BUTTON */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 20px;
      border-radius: var(--radius);
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* PILL BADGES */
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: .3px;
    }
    .badge-en  { background: #1e2d4a; color: #7cb4f4; }
    .badge-es  { background: #1e3830; color: #5dcaa5; }
    .badge-err { background: #2d1e1e; color: #ff5c6c; }
    .badge-ok  { background: #1e2d26; color: #22c987; }

    /* STAT CARDS */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-r);
      padding: 1rem 1.25rem;
    }
    .stat-card .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .stat-card .value { font-size: 26px; font-weight: 700; line-height: 1.1; }
    .stat-card .unit  { font-size: 13px; color: var(--muted); font-weight: 400; }

    /* SPINNER */
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* SKELETON */
    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* TOAST */
    #toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      font-size: 13px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <nav>
    <span class="nav-logo">Parallel<span>News</span></span>
    <a href="/" id="nav-news">Noticias</a>
    <a href="/benchmark" id="nav-bench">Benchmark</a>
  </nav>

  <main>{% block content %}{% endblock %}</main>

  <div id="toast"></div>

  <script>
    // Marcar nav activo
    const path = location.pathname;
    if (path === '/') document.getElementById('nav-news').classList.add('active');
    if (path === '/benchmark') document.getElementById('nav-bench').classList.add('active');

    // Toast helper
    function showToast(msg, duration = 3000) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), duration);
    }
  </script>
</body>
</html>
